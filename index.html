<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dream Interpreter</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --ink:       #0d0a1a;
      --parchment: #f5f0e8;
      --gold:      #c9a84c;
      --gold-dim:  #8a6a28;
      --violet:    #2e1a47;
      --violet-mid:#4a2d72;
      --mist:      rgba(201,168,76,0.12);
      --glow:      rgba(201,168,76,0.35);
    }

    html, body {
      min-height: 100%;
      font-family: 'Crimson Pro', Georgia, serif;
      background: var(--ink);
      color: var(--parchment);
      overflow-x: hidden;
    }

    /* ── Starfield ── */
    #stars {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      background:
        radial-gradient(ellipse 80% 60% at 50% 0%, #1a0a2e 0%, #0d0a1a 70%);
    }
    #stars::before, #stars::after {
      content: '';
      position: absolute; inset: 0;
      background-image:
        radial-gradient(1px 1px at 10% 15%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 25% 40%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 40% 8%,  rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 55% 30%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 70% 55%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 85% 12%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 92% 70%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 15% 80%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 60% 90%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 35% 65%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 78% 35%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 5%  50%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 48% 75%, rgba(255,255,255,0.8) 0%, transparent 100%),
        radial-gradient(1px 1px at 20% 25%, rgba(201,168,76,0.6)  0%, transparent 100%),
        radial-gradient(1px 1px at 65% 20%, rgba(201,168,76,0.4)  0%, transparent 100%);
    }
    #stars::after {
      background-image:
        radial-gradient(1px 1px at 33% 55%, rgba(255,255,255,0.6) 0%, transparent 100%),
        radial-gradient(1px 1px at 88% 45%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1.5px 1.5px at 72% 78%, rgba(255,255,255,0.9) 0%, transparent 100%),
        radial-gradient(1px 1px at 50% 50%, rgba(255,255,255,0.4) 0%, transparent 100%),
        radial-gradient(1px 1px at 8%  88%, rgba(255,255,255,0.7) 0%, transparent 100%),
        radial-gradient(1px 1px at 95% 22%, rgba(255,255,255,0.5) 0%, transparent 100%),
        radial-gradient(1px 1px at 42% 18%, rgba(201,168,76,0.5)  0%, transparent 100%);
      animation: twinkle 6s ease-in-out infinite alternate;
    }
    @keyframes twinkle {
      from { opacity: 0.6; }
      to   { opacity: 1;   }
    }

    /* ── Moon ── */
    .moon {
      position: fixed; top: 40px; right: 80px;
      width: 90px; height: 90px; border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #fffbe6, #e8d080 50%, #c9a84c);
      box-shadow: 0 0 40px 15px rgba(201,168,76,0.3), 0 0 80px 30px rgba(201,168,76,0.1);
      pointer-events: none; z-index: 0;
      animation: moonFloat 8s ease-in-out infinite;
    }
    @keyframes moonFloat {
      0%, 100% { transform: translateY(0);   }
      50%       { transform: translateY(-8px); }
    }

    /* ── Layout ── */
    .page {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 60px 20px 80px;
    }

    /* ── Header ── */
    .header { text-align: center; margin-bottom: 56px; }

    .eye {
      font-size: 48px; display: block; margin-bottom: 16px;
      animation: eyePulse 3s ease-in-out infinite;
      filter: drop-shadow(0 0 12px var(--gold));
    }
    @keyframes eyePulse {
      0%, 100% { transform: scale(1);    filter: drop-shadow(0 0 12px var(--gold)); }
      50%       { transform: scale(1.08); filter: drop-shadow(0 0 24px var(--gold)); }
    }

    h1 {
      font-family: 'Cinzel Decorative', serif;
      font-size: clamp(2rem, 5vw, 3.4rem);
      font-weight: 700;
      letter-spacing: 0.05em;
      color: var(--gold);
      text-shadow: 0 0 40px rgba(201,168,76,0.5);
      line-height: 1.2;
    }

    .subtitle {
      margin-top: 14px;
      font-size: 1.15rem;
      font-style: italic;
      color: rgba(245,240,232,0.55);
      letter-spacing: 0.04em;
    }

    /* ── Gold divider ── */
    .divider {
      width: 180px; height: 1px;
      background: linear-gradient(90deg, transparent, var(--gold), transparent);
      margin: 20px auto 0;
    }

    /* ── Card ── */
    .card {
      width: 100%; max-width: 680px;
      background: linear-gradient(145deg, rgba(46,26,71,0.85), rgba(13,10,26,0.92));
      border: 1px solid rgba(201,168,76,0.25);
      border-radius: 20px;
      padding: 44px 48px;
      box-shadow:
        0 0 0 1px rgba(201,168,76,0.05),
        0 20px 60px rgba(0,0,0,0.6),
        inset 0 1px 0 rgba(201,168,76,0.15);
      backdrop-filter: blur(12px);
    }

    /* ── Corner ornaments ── */
    .card { position: relative; overflow: hidden; }
    .card::before, .card::after {
      content: '✦';
      position: absolute;
      font-size: 18px; color: var(--gold-dim); opacity: 0.5;
    }
    .card::before { top: 14px; left: 18px; }
    .card::after  { bottom: 14px; right: 18px; }

    label {
      display: block;
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--gold);
      margin-bottom: 12px;
      text-transform: uppercase;
    }

    textarea {
      width: 100%;
      min-height: 150px;
      background: rgba(0,0,0,0.35);
      border: 1px solid rgba(201,168,76,0.2);
      border-radius: 12px;
      padding: 16px 20px;
      font-family: 'Crimson Pro', Georgia, serif;
      font-size: 1.1rem;
      color: var(--parchment);
      resize: vertical;
      transition: border-color 0.3s, box-shadow 0.3s;
      outline: none;
      line-height: 1.6;
    }
    textarea::placeholder { color: rgba(245,240,232,0.25); font-style: italic; }
    textarea:focus {
      border-color: rgba(201,168,76,0.5);
      box-shadow: 0 0 0 3px rgba(201,168,76,0.08), 0 0 20px rgba(201,168,76,0.1);
    }

    /* ── Button ── */
    .btn {
      margin-top: 24px;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #c9a84c, #8a6a28, #c9a84c);
      background-size: 200% 200%;
      border: none; border-radius: 12px;
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.85rem;
      letter-spacing: 0.12em;
      color: var(--ink);
      font-weight: 700;
      cursor: pointer;
      transition: background-position 0.4s, transform 0.2s, box-shadow 0.3s;
      box-shadow: 0 4px 20px rgba(201,168,76,0.3);
    }
    .btn:hover {
      background-position: right center;
      box-shadow: 0 6px 28px rgba(201,168,76,0.5);
      transform: translateY(-1px);
    }
    .btn:active { transform: translateY(0); }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

    /* ── Loader ── */
    .loader {
      display: none;
      text-align: center;
      margin-top: 32px;
    }
    .loader.show { display: block; }
    .orbs {
      display: flex; justify-content: center; gap: 10px; margin-bottom: 14px;
    }
    .orb {
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--gold);
      animation: orbBounce 1.2s ease-in-out infinite;
    }
    .orb:nth-child(2) { animation-delay: 0.2s; }
    .orb:nth-child(3) { animation-delay: 0.4s; }
    @keyframes orbBounce {
      0%, 100% { transform: translateY(0); opacity: 0.4; }
      50%       { transform: translateY(-12px); opacity: 1; }
    }
    .loader p { font-style: italic; color: rgba(245,240,232,0.45); font-size: 0.95rem; }

    /* ── Result ── */
    .result {
      display: none;
      margin-top: 36px;
      animation: fadeUp 0.6s ease forwards;
    }
    .result.show { display: block; }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .result-header {
      display: flex; align-items: center; gap: 10px;
      margin-bottom: 18px;
    }
    .result-header span {
      font-family: 'Cinzel Decorative', serif;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      color: var(--gold);
    }
    .result-line {
      flex: 1; height: 1px;
      background: linear-gradient(90deg, rgba(201,168,76,0.4), transparent);
    }

    .interpretation-box {
      background: rgba(0,0,0,0.3);
      border-left: 3px solid var(--gold);
      border-radius: 0 12px 12px 0;
      padding: 20px 24px;
      font-size: 1.15rem;
      line-height: 1.75;
      color: rgba(245,240,232,0.9);
      font-style: italic;
    }

    .meta {
      margin-top: 16px;
      display: flex; gap: 16px; flex-wrap: wrap;
    }
    .badge {
      font-size: 0.78rem;
      padding: 5px 14px;
      border-radius: 100px;
      letter-spacing: 0.06em;
    }
    .badge-confidence {
      background: rgba(201,168,76,0.12);
      border: 1px solid rgba(201,168,76,0.3);
      color: var(--gold);
    }
    .badge-match {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      color: rgba(245,240,232,0.5);
      font-style: italic;
    }

    /* ── Footer ── */
    .footer {
      margin-top: 56px;
      text-align: center;
      font-size: 0.82rem;
      color: rgba(245,240,232,0.2);
      letter-spacing: 0.08em;
    }

    @media (max-width: 520px) {
      .card { padding: 28px 24px; }
      .moon { width: 60px; height: 60px; top: 20px; right: 30px; }
    }
  </style>
</head>
<body>

<div id="stars"></div>
<div class="moon"></div>

<div class="page">

  <header class="header">
    <span class="eye">🌙</span>
    <h1>Dream Interpreter</h1>
    <p class="subtitle">Unveil the hidden language of your subconscious</p>
    <div class="divider"></div>
  </header>

  <div class="card">
    <label for="dreamInput">Describe Your Dream</label>
    <textarea
      id="dreamInput"
      placeholder="I was flying over a dark ocean, and suddenly the moon disappeared…"
    ></textarea>

    <button class="btn" id="interpretBtn" onclick="interpretDream()">
      ✦ &nbsp; Interpret My Dream &nbsp; ✦
    </button>

    <!-- Loading animation -->
    <div class="loader" id="loader">
      <div class="orbs">
        <div class="orb"></div>
        <div class="orb"></div>
        <div class="orb"></div>
      </div>
      <p>Consulting the dream realm…</p>
    </div>

    <!-- Result -->
    <div class="result" id="result">
      <div class="result-header">
        <span>✦ &nbsp; YOUR INTERPRETATION</span>
        <div class="result-line"></div>
      </div>
      <div class="interpretation-box" id="interpretationText"></div>
      <div class="meta">
        <span class="badge badge-confidence" id="confidenceBadge"></span>
        <span class="badge badge-match"      id="matchBadge"></span>
      </div>
    </div>
  </div>

  <p class="footer">✦ &nbsp; AI Dream Interpreter &nbsp; ✦ &nbsp; Class Project</p>
</div>

<script>
  async function interpretDream() {
    const dream = document.getElementById('dreamInput').value.trim();

    // Check if user typed something
    if (!dream) {
      alert('Please describe your dream first.');
      return;
    }

    // Show loader, hide result
    document.getElementById('loader').classList.add('show');
    document.getElementById('result').classList.remove('show');
    document.getElementById('interpretBtn').disabled = true;

    try {
      // Send dream to Flask backend
      const response = await fetch('/interpret', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ dream: dream })
      });

      const data = await response.json();

      // Show the interpretation
      document.getElementById('interpretationText').textContent = data.interpretation;
      document.getElementById('confidenceBadge').textContent = `${data.confidence}% match confidence`;
      document.getElementById('matchBadge').textContent = `Matched: "${data.matched_dream.substring(0, 50)}…"`;

      document.getElementById('result').classList.add('show');

    } catch (error) {
      alert('Something went wrong. Please try again.');
    }

    // Hide loader, re-enable button
    document.getElementById('loader').classList.remove('show');
    document.getElementById('interpretBtn').disabled = false;
  }

  // Allow pressing Enter + Ctrl to submit
  document.getElementById('dreamInput').addEventListener('keydown', function(e) {
    if (e.key === 'Enter' && e.ctrlKey) interpretDream();
  });
</script>

</body>
</html>
